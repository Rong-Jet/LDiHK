# Tests only: nothing here deploys. Netlify and Render deploy on
# their own when main changes, so run this on every branch before merging.
name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (unit + Postgres)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Enables backend/tests/test_postgres_integration.py (throwaway databases).
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.19"
          # Same Python as the production image (Dockerfile).
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run python -m unittest discover -s backend/tests -v

  frontend:
    name: Frontend type check + build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      # Generates .astro/types.d.ts (import.meta.env etc.); a fresh checkout
      # has no generated types, so the type check would fail without it.
      - run: npx astro sync
      - run: npx tsc --noEmit -p .
      - run: npm run build

  e2e:
    name: Browser end-to-end (local stack)
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.19"
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: uv sync --frozen
      - run: npm ci
        working-directory: Frontend
      - run: npx playwright install --with-deps --only-shell chromium
        working-directory: Frontend
      # Starts scripts/dev_stack.py --fresh (embedded Postgres, local S3).
      - run: npm run test:e2e
        working-directory: Frontend
      - if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            Frontend/playwright-report/
            Frontend/test-results/
          retention-days: 7
